name: Morning Traffic Check

on:
  schedule:
    # 6:00 AM Gulf Standard Time (UTC+4) = 2:00 AM UTC.
    # UAE does not observe daylight saving, so this stays correct all year.
    # Runs Monday-Friday only.
    - cron: "0 2 * * 1-5"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

jobs:
  check-traffic:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run traffic check
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          ORIGIN_ADDRESS: ${{ vars.ORIGIN_ADDRESS }}
          DESTINATION_ADDRESS: ${{ vars.DESTINATION_ADDRESS }}
          WAYPOINT_ADDRESS: ${{ vars.WAYPOINT_ADDRESS }}
          NORMAL_MINUTES: ${{ vars.NORMAL_MINUTES }}
          THRESHOLD_MINUTES: ${{ vars.THRESHOLD_MINUTES }}
        run: python check_traffic.py
